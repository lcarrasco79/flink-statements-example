name: Deploy Flink statement

run-name: "${{ inputs.operation }} / ${{ inputs.pipeline }} → demo-dev"

on:
  workflow_dispatch:
    # Both inputs are `choice`, so GitHub restricts them to the options below.
    # That is what makes interpolating them into `run:` safe. If either is ever
    # changed to `type: string`, move it into `env:` and quote it in the shell
    # instead - free text interpolated into `run:` is a script injection.
    inputs:
      operation:
        description: "Lifecycle operation"
        required: true
        type: choice
        options:
          - create-stopped
          - status
          - start
          - stop
          - resume
      pipeline:
        description: "Pipeline name"
        required: true
        default: "basic"
        type: choice
        options:
          - basic
          - stateful

permissions:
  contents: read
  id-token: write

concurrency:
  group: flink-deploy-demo-dev-${{ inputs.pipeline }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: demo-dev
    name: "${{ inputs.operation }} / ${{ inputs.pipeline }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Retrieve Flink credentials
        env:
          AWS_REGION: "${{ vars.AWS_REGION }}"
          AWS_SECRET_ID: "${{ vars.AWS_SECRET_ID }}"
        shell: bash
        run: |
          set -euo pipefail

          SECRET_JSON="$(
            aws secretsmanager get-secret-value \
              --secret-id "$AWS_SECRET_ID" \
              --region "$AWS_REGION" \
              --query 'SecretString' \
              --output text
          )"

          if [ -z "$SECRET_JSON" ] || [ "$SECRET_JSON" = "None" ]; then
            echo "SecretString was empty or unavailable"
            exit 1
          fi

          if ! printf '%s' "$SECRET_JSON" | jq -e 'try (
            type == "object" and
            has("FLINK_API_KEY") and
            has("FLINK_API_SECRET") and
            ((.FLINK_API_KEY | type) == "string") and
            ((.FLINK_API_SECRET | type) == "string") and
            ((.FLINK_API_KEY | length) > 0) and
            ((.FLINK_API_SECRET | length) > 0)
          ) catch false' >/dev/null; then
            echo "Secret must contain non-empty string fields FLINK_API_KEY and FLINK_API_SECRET"
            exit 1
          fi

          FLINK_API_KEY="$(printf '%s' "$SECRET_JSON" | jq -r '.FLINK_API_KEY')"
          FLINK_API_SECRET="$(printf '%s' "$SECRET_JSON" | jq -r '.FLINK_API_SECRET')"

          echo "::add-mask::$FLINK_API_KEY"
          echo "::add-mask::$FLINK_API_SECRET"

          {
            echo "FLINK_API_KEY=$FLINK_API_KEY"
            echo "FLINK_API_SECRET=$FLINK_API_SECRET"
          } >> "$GITHUB_ENV"


      - name: Execute lifecycle operation
        shell: bash
        run: >-
          python -m adapter.cli
          ${{ inputs.operation }}
          --pipeline ${{ inputs.pipeline }}
          --config config/demo-dev.yaml

      # The adapter writes a deployment manifest per operation. The runner is
      # torn down afterwards, so publish them or the audit trail is lost.
      # `always()` keeps the manifest from a failed run, which is the one that
      # matters most when diagnosing.
      - name: Upload deployment manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ inputs.pipeline }}-${{ inputs.operation }}-${{ github.run_id }}
          path: manifests/
          if-no-files-found: warn
          retention-days: 90
